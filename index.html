<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="theme-color" content="#3b3fd8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كورة برو</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f8;--cd:#fff;--tx:#12162b;--mu:#69708a;--ac:#3b3fd8;--gd:#f2a900;--ln:#e4e6ef;--lv:#e5384f;--ok:#0f9d63;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--cd:#151b33;--tx:#eef0fa;--mu:#8e96b5;--ac:#7c83ff;--ln:#242c4a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1020;--cd:#151b33;--tx:#eef0fa;--mu:#8e96b5;--ac:#7c83ff;--ln:#242c4a;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,sans-serif}
body{padding-bottom:84px;max-width:560px;margin:auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 16px 8px;display:flex;align-items:center;justify-content:space-between}
header::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1{font-size:22px;font-weight:800;letter-spacing:-.3px}h1 b{color:var(--ac)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.ib{width:38px;height:38px;border-radius:12px;background:var(--cd);border:1px solid var(--ln)}
.pts{background:var(--gd);color:#1a1300;font-weight:800;border-radius:20px;padding:4px 12px;font-size:14px;margin-inline-end:8px}
.days{display:flex;gap:8px;padding:4px 16px 10px;overflow-x:auto}
.chip{padding:7px 16px;border-radius:20px;background:var(--cd);border:1px solid var(--ln);font-size:14px;white-space:nowrap;font-weight:600}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.lg{margin:10px 16px;background:var(--cd);border:1px solid var(--ln);border-radius:16px;overflow:hidden}
.lgh{padding:10px 14px;font-weight:800;font-size:14px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--ln)}
.m{display:grid;grid-template-columns:1fr 78px 1fr;align-items:center;padding:12px 10px;width:100%;border-bottom:1px solid var(--ln);text-align:center}
.m:last-child{border:0}
.t{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:13px;font-weight:600}
.bd{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px}
.sc{font-size:22px;font-weight:800;direction:ltr}.st{font-size:12px;color:var(--mu)}
.live{color:var(--lv);font-weight:800;font-size:12px}.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--lv);margin-inline-end:4px;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.2}}@media(prefers-reduced-motion:reduce){.live::before{animation:none}}
.nw{margin:12px 16px;background:var(--cd);border:1px solid var(--ln);border-radius:16px;overflow:hidden;display:block;width:calc(100% - 32px);text-align:right}
.nw .im{height:120px;display:grid;place-items:center;font-size:44px}
.nw div.b{padding:12px 14px}.nw h3{font-size:16px;line-height:1.5}.nw p{font-size:12px;color:var(--mu);margin-top:6px}
.nw.s{display:flex;align-items:center}.nw.s .im{width:84px;height:84px;flex:none;font-size:30px}
.sec{padding:6px 16px;font-weight:800;font-size:18px}
.card{margin:10px 16px;background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:14px}
.pr{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}
.stp{display:flex;align-items:center;gap:6px;direction:ltr}
.stp button{width:30px;height:30px;border-radius:9px;background:var(--bg);border:1px solid var(--ln);font-weight:800}
.stp span{font-size:20px;font-weight:800;min-width:20px}
.go{width:100%;margin-top:12px;padding:10px;border-radius:12px;background:var(--ac);color:#fff;font-weight:800}
.go[disabled]{background:var(--ok)}
.lb{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln)}.lb:last-child{border:0}
.lb .r{width:24px;font-weight:800;color:var(--mu)}.lb .n{flex:1}.lb.me{color:var(--ac);font-weight:800}
.tb{width:100%;border-collapse:collapse;font-size:13px;text-align:center}
.tb th{color:var(--mu);font-weight:600;padding:8px 4px;border-bottom:1px solid var(--ln)}.tb td{padding:9px 4px;border-bottom:1px solid var(--ln)}
.tb td:nth-child(2){text-align:right;font-weight:600}.tb td:last-child{font-weight:800}
.tb tr:nth-child(-n+2) td:first-child{box-shadow:inset -3px 0 var(--ok)}
nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:auto;background:var(--cd);border-top:1px solid var(--ln);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mu);padding:4px}
nav button i{font-style:normal;font-size:20px}nav button.on{color:var(--ac)}
.ov{position:fixed;inset:0;background:#0009;z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sh{background:var(--bg);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:22px 22px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sh .hd{display:grid;grid-template-columns:1fr 90px 1fr;padding:18px 10px 8px;text-align:center;align-items:center}
.tabs button{font-size:12px;padding:10px 2px}.bn{padding:6px 18px;font-size:13px}.bn b{display:block;margin-bottom:2px}.bn span{color:var(--mu)}.cm{display:flex;gap:10px;padding:9px 16px;font-size:14px;line-height:1.6;border-bottom:1px solid var(--ln)}.cm b{min-width:34px;color:var(--ac)}
.cdg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cdg div{background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:10px 0}.cdg b{display:block;font-size:26px;font-weight:800;color:var(--ac)}.cdg span{font-size:11px;color:var(--mu)}
.tabs{display:flex;border-bottom:1px solid var(--ln);margin:6px 16px}
.tabs button{flex:1;padding:10px;font-weight:600;color:var(--mu);border-bottom:3px solid transparent}.tabs button.on{color:var(--ac);border-color:var(--ac)}
.ev{display:flex;gap:10px;padding:9px 16px;font-size:14px;align-items:center}.ev b{width:34px;color:var(--mu)}
.pitch{margin:12px 16px;border-radius:14px;background:repeating-linear-gradient(#1a8a4f 0 40px,#188048 40px 80px);position:relative;aspect-ratio:3/4.4;overflow:hidden;border:2px solid #fff3}
.pitch::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid #fff6}
.pitch::after{content:"";position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px;border:2px solid #fff6;border-radius:50%}
.pl{position:absolute;transform:translate(-50%,-50%);text-align:center;color:#fff;font-size:10px;font-weight:600;width:52px;line-height:1.2;z-index:1}
.pl i{display:grid;place-items:center;width:26px;height:26px;margin:0 auto 2px;border-radius:50%;font-style:normal;font-weight:800;font-size:11px;border:2px solid #fff}
.q{font-size:17px;font-weight:800;line-height:1.6;margin:6px 0 12px}
.op{display:block;width:100%;text-align:right;padding:12px;margin-bottom:8px;border-radius:12px;border:1.5px solid var(--ln);background:var(--bg);font-weight:600}
.op.ok{border-color:var(--ok);background:#0f9d6322}.op.no{border-color:var(--lv);background:#e5384f22}
.bar{height:8px;border-radius:8px;background:var(--ln);overflow:hidden}.bar i{display:block;height:100%;background:var(--gd)}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 18px;border-radius:20px;font-weight:600;font-size:14px;z-index:30;display:none}
select,input[type=text]{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit;margin-top:8px}
.m{cursor:pointer}
.c2{display:grid;grid-template-columns:1fr 46px 1fr;align-items:start;gap:6px;padding:9px 12px;border-bottom:1px solid var(--ln);font-size:13px;line-height:1.6}.c2 b{text-align:center;color:var(--ac);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:1px 0;font-size:12px}.c2n{padding:7px 16px;text-align:center;color:var(--mu);font-size:12px;background:var(--bg)}.c2h{display:grid;grid-template-columns:1fr 1fr;padding:8px 16px;font-weight:800;font-size:14px;border-bottom:2px solid var(--ln)}
.av{position:relative;display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;color:#fff;font-weight:800;flex:none;vertical-align:middle}.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}.rt{display:inline-block;min-width:32px;padding:1px 6px;border-radius:8px;color:#fff;font-weight:800;font-size:11px;text-align:center}.tl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.tl div{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:10px 4px;text-align:center}.tl b{display:block;font-size:18px}.tl span{font-size:11px;color:var(--mu)}.pl{cursor:pointer}.pl .av{border:2px solid #fff;margin:0 auto 2px}
</style></head><body>
<header><h1>كورة<b>برو</b></h1><div><span class="pts" id="pts">0 ن</span><button class="ib" onclick="srchOpen()" aria-label="بحث">🔍</button> <button class="ib" onclick="stg()" aria-label="الإعدادات">⚙️</button> <button class="ib" onclick="th()" aria-label="الوضع">◐</button></div></header>
<main id="v"></main>
<nav id="nv"></nav>
<div class="ov" id="ov" onclick="if(event.target===this)cl()"><div class="sh" id="sh"></div></div>
<div class="toast" id="ts"></div>

<div class="sec" style="font-size:17px;padding-top:12px">👥 اللاعبون</div><div id="sqd" style="padding:0 16px">${SQ.length?sqList(c,SQ)+`<p class="st" style="padding:8px 0">من آخر تشكيلة متاحة. اضغط على اللاعب لرؤية بطاقته.</p>`:`<p class="st">لا تتوفر قائمة اللاعبين حالياً.</p>`}</div>`);
if(HAS_API)fetch("/api/team/"+c).then(r=>r.json()).then(j=>{if(CUR=="tp"&&j.squad&&j.squad.length){SQ=j.squad;const e=$("sqd");if(e)e.innerHTML=(j.coach?`<p class="st">المدرب: <b>${j.coach}</b></p>`:"")+sqList(c,SQ)}}).catch(()=>{})}
function pl(c,k){card(c,SQ[k],`tp('${c}')`)}
function plp(i){const p=PLX[i];if(p)card(p.c,p,p.bk,p.mid)}
const bs=p=>`<div class="card" style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><div class="st">المركز</div><b>${PA[p.g]||"—"}</b></div><div><div class="st">رقم القميص</div><b>${p.num||"—"}</b></div><div><div class="st">الجنسية</div><b>${p.nat||"—"}</b></div><div><div class="st">العمر</div><b>${p.age?p.age+" سنة":"—"}</b></div></div>`;
const tl=a=>`<div class="tl">${a.filter(x=>x[0]!==""&&x[0]!=null&&x[0]!==0&&x[0]!=="0 (0)").map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join("")}</div>`;
const bdf=new Intl.DateTimeFormat("ar-IQ-u-nu-arab",{day:"numeric",month:"long",year:"numeric"});
const arU=s=>String(s||"").replace("cm","سم").replace("kg","كغ");
function full(j,p,mm){let h="";const b=j.birth||{},s=j.st;
if(j.inj)h+=`<p class="card st" style="color:var(--lv)">🩹 اللاعب مصاب حالياً</p>`;
if(mm)h+=`<div class="card"><b>⚽ أداؤه في هذه المباراة</b> ${rt(mm.r)}${tl([[mm.min,"دقيقة"],[mm.g,"أهداف"],[mm.a,"صناعة"],[mm.sh?mm.sh+" ("+mm.sot+")":"","تسديدات (على المرمى)"],[mm.kp,"تمريرات مفتاحية"],[mm.pa,"تمريرات"],[mm.tk,"تدخلات"],[mm.sv,"تصديات"]])}</div>`;
h+=`<div class="card" style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><div class="st">العمر</div><b>${j.age?j.age+" سنة":p.age?p.age+" سنة":"—"}</b></div><div><div class="st">تاريخ الميلاد</div><b>${b.date?bdf.format(new Date(b.date)):"—"}</b></div><div><div class="st">الطول</div><b>${arU(j.height)||"—"}</b></div><div><div class="st">الوزن</div><b>${arU(j.weight)||"—"}</b></div><div><div class="st">الجنسية</div><b>${j.nat||p.nat||"—"}</b></div><div><div class="st">مكان الميلاد</div><b>${b.place||"—"}</b></div>${j.foot?`<div><div class="st">القدم المفضلة</div><b>${j.foot}</b></div>`:""}${j.value?`<div><div class="st">القيمة السوقية</div><b>${j.value}</b></div>`:""}</div>`;
if(s&&(s.apps||s.min))h+=`<div class="card"><b>📊 إحصائيات الموسم</b> ${rt(s.rt)}${tl([[s.apps,"مباراة"],[s.min,"دقيقة"],[s.g,"هدف"],[s.a,"صناعة"],[s.sh?s.sh+" ("+s.sot+")":"","تسديدات (على المرمى)"],[s.kp,"تمريرات مفتاحية"],[s.tk,"تدخلات"],[s.dr,"مراوغات ناجحة"],[s.sv,"تصديات"],[s.yc,"🟨 صفراء"],[s.rc,"🟥 حمراء"],[s.pa,"تمريرات"]])}</div>`;
return h}
function card(c,p,bk,mid){if(!p)return;CUR="pl";const m=mid?M.find(x=>x.id==mid):null,mm=m&&m.prm?m.prm[p.id]:null;
sheet(`<div style="text-align:center;padding:22px 16px 6px">${av(p,c,92)}<h2 style="font-size:21px;font-weight:800;margin-top:10px">${p.n}${p.num?` <span class="st">#${p.num}</span>`:""}</h2><div class="st" style="display:flex;gap:8px;justify-content:center;align-items:center;margin-top:6px"><span onclick="tp('${c}')" style="cursor:pointer">${bd(c)}</span>${N(c)}${PA[p.g]?" • "+PA[p.g]:""}</div></div><div id="pc" style="padding:0 16px">${HAS_API&&p.id?`<p class="st" style="text-align:center;padding:14px">جارٍ تحميل بيانات اللاعب…</p>`:bs(p)}</div><div style="padding:0 16px"><a class="go" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://ar.wikipedia.org/w/index.php?search=${encodeURIComponent(p.n)}">📖 اقرأ عنه في ويكيبيديا</a><button class="go" style="background:var(--cd);color:var(--tx);border:1px solid var(--ln)" onclick="${bk||`tp('${c}')`}">رجوع</button></div>`);
if(HAS_API&&p.id)fetch("/api/player/"+p.id).then(r=>r.json()).then(j=>{if(CUR=="pl"&&$("pc"))$("pc").innerHTML=j&&(j.name||j.st)?full(j,p,mm):bs(p)}).catch(()=>{if($("pc"))$("pc").innerHTML=bs(p)})}
function motm(m){if(!m.prm)return"";const a=Object.values(m.prm).filter(x=>x.min>0&&x.r).sort((x,y)=>y.r-x.r);if(!a.length)return"";const t=a[0],c=t.s=="h"?m.h:m.a;
return `<div class="card" style="display:flex;gap:12px;align-items:center;border-color:var(--gd)">${av({n:t.n,ph:t.ph},c,48)}<div style="flex:1"><b>🌟 ${m.s=="ft"?"نجم المباراة":"الأفضل حتى الآن"}</b><div>${t.n} • ${N(c)}</div><div class="st">${t.g?t.g+" هدف • ":""}${t.a?t.a+" صناعة • ":""}${t.min} دقيقة</div></div>${rt(t.r)}</div>`}
/* ---- النقاط والمسابقة ---- */
const td=()=>new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Baghdad"});
function bonus(k){if(HAS_API){api("/api/bonus",{uid:S.uid,kind:k}).then(r=>{if(r&&r.pts)toast("+"+r.pts+" نقطة");loadLB()})}else{S.pts+=k=="quiz"?10:3}sv()}
function scoreLocal(){if(HAS_API)return;let ch=0;for(const id in S.pr){const m=M.find(x=>x.id==id);if(!m||m.s!="ft"||S.sc[id]!=null)continue;const[a,b]=S.pr[id];const p=(a==m.hs&&b==m.as)?5:(Math.sign(a-b)==Math.sign(m.hs-m.as))?2:0;S.sc[id]=p;S.pts+=p;ch+=p;if(p)toast(p==5?"🎯 توقع صحيح بالضبط! +5":"✅ توقعت الفائز +2",3500)}if(ch||Object.keys(S.sc).length)sv();
if(S.dl!=td()){S.dl=td();bonus("daily");sv()}}
async function loadLB(){if(!HAS_API)return;try{LB=await(await fetch("/api/league?uid="+S.uid)).json();nav();if(S.tab==3&&!$("ov").classList.contains("on"))R()}catch(e){}}
function LBV(){let h=`<div class="sec">🏆 دوري المتسابقين</div>`;const w=S.lbt!="a";let top,me,pz="اشتراك مجاني لمدة شهر",en="";
if(HAS_API){if(!LB)return h+`<p class="card st">جارٍ التحميل…</p>`;const b=LB[w?"wk":"all"];top=b.top;me=b.me;pz=LB.prize;en=LB.end?`<div style="font-size:13px;opacity:.9">ينتهي الأسبوع ${dg.format(new Date(LB.end))}</div>`:"";
if(LB.volatile)h+=`<div class="card st" style="border-color:var(--lv)">⚠️ المسابقة تعمل حالياً بذاكرة مؤقتة وقد تُصفَّر النقاط.</div>`;if(LB.mine)h+=`<div class="card" style="border-color:var(--gd)"><b>🎉 فزت بالمركز الأول الأسبوع الماضي!</b><p style="margin-top:6px">كود جائزتك: <b style="color:var(--gd);letter-spacing:1px">${LB.mine}</b></p><p class="st">أرسل هذا الكود لإدارة التطبيق لتفعيل الجائزة.</p></div>`}
else{const ex=[["أحمد",1240],["سارة",1115],["خالد",980],["ليلى",610],["عمر",420]];top=[...ex,[S.nick,S.pts,1]].sort((a,b)=>b[1]-a[1]).map((x,i)=>({r:i+1,nick:x[0],pts:x[1],me:!!x[2]}));me=top.find(x=>x.me)}
h+=`<div class="card" style="background:linear-gradient(135deg,var(--ac),#1a1f6b);color:#fff;border:0"><b>🎁 جائزة المركز الأول: ${pz}</b>${en}</div>
<div class="days" style="padding:0 16px 6px"><button class="chip ${w?"on":""}" onclick="S.lbt='w';sv();R()">هذا الأسبوع</button><button class="chip ${w?"":"on"}" onclick="S.lbt='a';sv();R()">كل الأوقات</button></div>
<div class="card">${top.slice(0,10).map(x=>`<div class="lb ${x.me?"me":""}"><span class="r">${x.r==1?"🥇":x.r==2?"🥈":x.r==3?"🥉":x.r}</span><span class="n">${x.nick}${x.me?" (أنت)":""}</span><span>${x.pts} ن</span></div>`).join("")||`<p class="st">لا يوجد متسابقون بعد. كن الأول!</p>`}${me&&!top.slice(0,10).some(x=>x.me)?`<div class="lb me"><span class="r">${me.r}</span><span class="n">${S.nick} (أنت)</span><span>${me.pts} ن</span></div>`:""}</div>
<div class="card st" style="line-height:1.9"><b style="color:var(--tx)">طريقة جمع النقاط</b><br>🎯 توقع النتيجة بالضبط: +5 • ✅ توقع الفائز: +2<br>🧠 إجابة صحيحة في الاختبار: +10 (حتى 5 يومياً) • 📅 دخول يومي: +3${HAS_API?"":"<br><br>⚠️ الترتيب هنا توضيحي بأسماء أمثلة. المسابقة الحقيقية بين اللاعبين تعمل في نسخة الخادم."}</div>`;
if(HAS_API&&Date.now()-LBT>15000){LBT=Date.now();loadLB()}return h}


function op(id,tab=0){const m=M.find(x=>x.id==id);OPN=id;OTB=tab;op0(id,tab);
if(m&&m.s!="ns"&&m.s!="pp"&&m.s!="cn"&&(!m.dt||Date.now()-m.dt>12000)){m.dt=Date.now();fetch("/api/match/"+id).then(r=>r.json()).then(j=>{m.det=j;m.prm=PRM(j.pr);if(OPN==id)op0(id,OTB)}).catch(()=>{})}}
R();load();go();
api("/api/join",{uid:S.uid,nick:S.nick}).then(loadLB);setInterval(loadLB,60000);
</script></body></html>
